<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture</title>
  <desc id="desc">ShopLedger UI, Express server, routes, library modules, configuration, JSON data file, and the order placement sequence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:750}.subtitle{font-size:15px;fill:#64748b}.section{font-size:14px;font-weight:750;letter-spacing:.1em;fill:#64748b}.heading{font-size:17px;font-weight:700}.small{font-size:13px;fill:#475569}.tiny{font-size:11px;fill:#64748b}.card{stroke-width:1.5;rx:12}.ui{fill:#eff6ff;stroke:#60a5fa}.server{fill:#f8fafc;stroke:#94a3b8}.route{fill:#f5f3ff;stroke:#a78bfa}.lib{fill:#f0fdf4;stroke:#4ade80}.data{fill:#fff7ed;stroke:#fb923c}.config{fill:#f8fafc;stroke:#94a3b8}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.orderedge{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#blueArrow)}.num{fill:#2563eb;stroke:#fff;stroke-width:2}.numtext{font-size:13px;font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1600" height="1260" fill="#f8fafc"/>
  <text x="52" y="58" class="title">ShopLedger architecture</text>
  <text x="52" y="86" class="subtitle">Browser billing UI · Express routes · business logic · JSON file storage</text>

  <text x="52" y="132" class="section">APPLICATION</text>
  <rect x="52" y="152" width="310" height="132" class="card ui"/>
  <text x="76" y="185" class="heading">Browser UI</text>
  <text x="76" y="212" class="small">public/index.html</text>
  <text x="76" y="234" class="small">public/js/app.js</text>
  <text x="76" y="256" class="small">public/css/style.css</text>

  <path d="M362 218H437" class="edge"/>
  <text x="376" y="203" class="tiny">HTTP</text>
  <rect x="440" y="152" width="405" height="132" class="card server"/>
  <text x="466" y="185" class="heading">server.js · Express app</text>
  <text x="466" y="212" class="small">JSON body parser · serves public/</text>
  <text x="466" y="234" class="small">Mounts the four /api routers</text>
  <text x="466" y="256" class="small">GET /orders/:id/invoice</text>

  <rect x="890" y="152" width="300" height="132" class="card config"/>
  <text x="914" y="185" class="heading">config.js</text>
  <text x="914" y="212" class="small">Port · shop details</text>
  <text x="914" y="234" class="small">Tax HSN slabs · coupons</text>
  <text x="914" y="256" class="small">Inventory defaults · admin key</text>
  <path d="M845 218H890" class="edge"/>

  <rect x="1235" y="152" width="313" height="132" class="card data"/>
  <text x="1259" y="185" class="heading">data/db.json</text>
  <text x="1259" y="212" class="small">Products · customers · orders</text>
  <text x="1259" y="234" class="small">Settlements · auditLog · ID counters</text>
  <text x="1259" y="256" class="small">Read and written by lib/store.js</text>

  <text x="52" y="334" class="section">ROUTERS · routes/</text>
  <rect x="52" y="354" width="354" height="155" class="card route"/>
  <text x="76" y="388" class="heading">products.js</text>
  <text x="76" y="416" class="small">GET /products · GET /coupons</text>
  <text x="76" y="447" class="tiny">Uses store, inventory, tax, coupons</text>

  <rect x="430" y="354" width="354" height="155" class="card route"/>
  <text x="454" y="388" class="heading">orders.js</text>
  <text x="454" y="416" class="small">List / get · create · cancel orders</text>
  <text x="454" y="447" class="tiny">Uses store, inventory, pricing, coupons,</text>
  <text x="454" y="466" class="tiny">orders, ledger</text>

  <rect x="808" y="354" width="354" height="155" class="card route"/>
  <text x="832" y="388" class="heading">customers.js</text>
  <text x="832" y="416" class="small">GET /customers · POST settlement</text>
  <text x="832" y="447" class="tiny">Uses store and ledger</text>

  <rect x="1186" y="354" width="362" height="155" class="card route"/>
  <text x="1210" y="388" class="heading">reports.js</text>
  <text x="1210" y="416" class="small">Dashboard · GST · pricing preview · export</text>
  <text x="1210" y="447" class="tiny">Uses store, reports, pricing, coupons</text>

  <path d="M642 284V324H230V354M642 324H607V354M642 324H985V354M642 324H1367V354" class="edge"/>

  <text x="52" y="557" class="section">BUSINESS MODULES · lib/</text>
  <rect x="52" y="577" width="280" height="78" class="card lib"/><text x="74" y="609" class="heading">coupons.js</text><text x="74" y="634" class="small">Coupon validation and discount</text>
  <rect x="352" y="577" width="280" height="78" class="card lib"/><text x="374" y="609" class="heading">dates.js</text><text x="374" y="634" class="small">Date helpers</text>
  <rect x="652" y="577" width="280" height="78" class="card lib"/><text x="674" y="609" class="heading">inventory.js</text><text x="674" y="634" class="small">Stock checks and updates</text>
  <rect x="952" y="577" width="280" height="78" class="card lib"/><text x="974" y="609" class="heading">invoice.js</text><text x="974" y="634" class="small">Printable HTML invoice</text>
  <rect x="1252" y="577" width="296" height="78" class="card lib"/><text x="1274" y="609" class="heading">ledger.js</text><text x="1274" y="634" class="small">Khata credit and settlements</text>

  <rect x="52" y="672" width="280" height="78" class="card lib"/><text x="74" y="704" class="heading">orders.js</text><text x="74" y="729" class="small">Order lifecycle</text>
  <rect x="352" y="672" width="280" height="78" class="card lib"/><text x="374" y="704" class="heading">pricing.js</text><text x="374" y="729" class="small">Subtotal, discounts, tax, total</text>
  <rect x="652" y="672" width="280" height="78" class="card lib"/><text x="674" y="704" class="heading">reports.js</text><text x="674" y="729" class="small">Dashboard and reconciliation</text>
  <rect x="952" y="672" width="280" height="78" class="card lib"/><text x="974" y="704" class="heading">store.js</text><text x="974" y="729" class="small">JSON read/write and audit log</text>
  <rect x="1252" y="672" width="296" height="78" class="card lib"/><text x="1274" y="704" class="heading">tax.js</text><text x="1274" y="729" class="small">GST rate and CGST/SGST split</text>

  <path d="M1092 750V778H1391V284" class="edge"/>
  <text x="1275" y="772" class="tiny">lib/store.js</text>

  <rect x="52" y="800" width="1496" height="408" rx="16" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="78" y="840" class="section" style="fill:#1d4ed8">ORDER PLACEMENT · POST /api/orders</text>

  <circle cx="105" cy="902" r="16" class="num"/><text x="105" y="902" class="numtext">1</text>
  <rect x="132" y="874" width="300" height="82" class="card ui"/>
  <text x="154" y="906" class="heading">Browser UI</text><text x="154" y="932" class="small">Sends items, customer, mode, status, coupon</text>
  <path d="M432 915H490" class="orderedge"/>

  <circle cx="513" cy="902" r="16" class="num"/><text x="513" y="902" class="numtext">2</text>
  <rect x="540" y="874" width="300" height="82" class="card route"/>
  <text x="562" y="906" class="heading">routes/orders.js</text><text x="562" y="932" class="small">Resolves products and checks stock</text>
  <path d="M840 915H898" class="orderedge"/>

  <circle cx="921" cy="902" r="16" class="num"/><text x="921" y="902" class="numtext">3</text>
  <rect x="948" y="874" width="360" height="82" class="card lib"/>
  <text x="970" y="906" class="heading">pricing.js · coupons.js · tax.js</text><text x="970" y="932" class="small">Calculates subtotal, discount, GST, total</text>
  <path d="M1308 915H1365" class="orderedge"/>

  <circle cx="1388" cy="902" r="16" class="num"/><text x="1388" y="902" class="numtext">4</text>
  <rect x="1415" y="874" width="115" height="82" class="card lib"/>
  <text x="1433" y="906" class="heading" style="font-size:14px">ledger.js</text><text x="1433" y="932" class="tiny">Khata check</text>

  <path d="M1472 956V1010H1370" class="orderedge"/>
  <circle cx="1347" cy="1010" r="16" class="num"/><text x="1347" y="1010" class="numtext">5</text>
  <rect x="1050" y="980" width="272" height="66" class="card lib"/>
  <text x="1072" y="1008" class="heading">inventory.js</text><text x="1072" y="1030" class="small">Reserves by deducting stock</text>
  <path d="M1050 1013H965" class="orderedge"/>

  <circle cx="942" cy="1013" r="16" class="num"/><text x="942" y="1013" class="numtext">6</text>
  <rect x="650" y="980" width="265" height="66" class="card lib"/>
  <text x="672" y="1008" class="heading">orders.js</text><text x="672" y="1030" class="small">Adds order with next ID</text>
  <path d="M650 1013H565" class="orderedge"/>

  <circle cx="542" cy="1013" r="16" class="num"/><text x="542" y="1013" class="numtext">7</text>
  <rect x="250" y="980" width="265" height="66" class="card lib"/>
  <text x="272" y="1008" class="heading">store.js</text><text x="272" y="1030" class="small">Adds audit entry and writes data</text>
  <path d="M250 1013H165V1100H250" class="orderedge"/>
  <rect x="250" y="1070" width="265" height="66" class="card data"/>
  <text x="272" y="1098" class="heading">data/db.json</text><text x="272" y="1120" class="small">Persists updated app state</text>
  <text x="578" y="1110" class="tiny">On success, the UI receives the order and refreshes products, dashboard, and customers.</text>
</svg>
